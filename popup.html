<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Netflix Subtitle Styler</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Subtitle Styler</h1>
    <label class="switch"><input type="checkbox" id="enabled"> Enabled</label>
  </header>

  <div class="preview"><span id="preview">This is how your subtitles will look.</span></div>

  <section>
    <h2>Font <button id="refreshFonts" type="button" title="Re-read installed fonts">↻</button></h2>
    <input id="fontSearch" type="search" placeholder="Search installed fonts…" autocomplete="off">
    <select id="fontFamily" size="7"></select>
    <div class="hint" id="fontCount"></div>
  </section>

  <section class="grid">
    <label>Size <output id="fontSizeOut"></output></label>
    <input id="fontSize" type="range" min="0" max="12" step="0.25">

    <label>Style</label>
    <div class="row">
      <label><input type="checkbox" id="bold"> Bold</label>
      <label><input type="checkbox" id="italic"> Italic</label>
    </div>

    <label>Text color</label>
    <div class="row">
      <input id="textColor" type="color">
      <input id="textOpacity" type="range" min="0" max="100" step="5" title="Opacity">
      <output id="textOpacityOut"></output>
    </div>

    <label>Edge</label>
    <select id="edgeStyle">
      <option value="none">None</option>
      <option value="outline">Outline</option>
      <option value="shadow">Drop shadow</option>
      <option value="raised">Raised</option>
      <option value="depressed">Depressed</option>
    </select>

    <label>Edge color / width</label>
    <div class="row">
      <input id="edgeColor" type="color">
      <input id="edgeWidth" type="range" min="0" max="8" step="1">
      <output id="edgeWidthOut"></output>
    </div>

    <label>Background</label>
    <div class="row">
      <input id="bgColor" type="color">
      <input id="bgOpacity" type="range" min="0" max="100" step="5" title="Opacity">
      <output id="bgOpacityOut"></output>
    </div>

    <label>Position</label>
    <div class="row">
      <label><input type="checkbox" id="reposition"> Bottom-center</label>
      <input id="bottomOffset" type="range" min="0" max="40" step="1" title="Distance from bottom">
      <output id="bottomOffsetOut"></output>
    </div>
  </section>

  <footer>
    <button id="reset" type="button">Reset to defaults</button>
  </footer>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
